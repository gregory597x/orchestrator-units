[project]
name = "extract-worker"
version = "0.1.0"
description = "Tiered text extraction worker for the orchestrator job API"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "pymupdf>=1.24",   # AGPL: keep this package out of the public orchestrator repo
]

[project.optional-dependencies]
host = ["ocrmac>=1.0; sys_platform == 'darwin'"]   # Apple Vision OCR, macOS host only
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
extract-worker = "extract_worker.cli:worker_main"
extract-submit = "extract_worker.cli:submit_main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["extract_worker*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
