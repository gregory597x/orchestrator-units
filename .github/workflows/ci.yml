name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  extract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: units/extract
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils pandoc
      - run: pip install -e '.[dev]'
      - run: ruff format --check .
      - run: ruff check .
      - run: pytest -q
